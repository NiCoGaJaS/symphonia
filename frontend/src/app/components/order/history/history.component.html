<p-table
    class="table"
    [value]="items"
    [lazy]="true"
    (onLazyLoad)="loadProducts($event)"
    [paginator]="true"
    [rows]="page?.size ?? DEFAULT_ITEMS_PER_PAGE"
    [totalRecords]="page?.total_elements ?? 0"
    [rowsPerPageOptions]="[1, 25, 50]"
    [loading]="loading"
    [showGridlines]="true"
    size="large"
>
    <ng-template #caption>
        <h1>Bestellhistorie</h1>
    </ng-template>

    <ng-template #header>
        <tr class="headers">
            <th id="orderId" class="first-header">Bestellnummer</th>
            <th id="date" class="remove-border-left">Datum</th>
            <th id="time" class="remove-border-left">Uhrzeit</th>
            <th id="total" class="remove-border-left">Gesamtbetrag</th>
            <th id="link" class="last-header remove-border-left"></th>
        </tr>
    </ng-template>

    <ng-template #body let-order>
        <tr>
            <td>{{ order.id }}</td>
            <td class="remove-border-left">
                {{ order.timestamp | date: 'dd.MM.yyyy' }}
            </td>
            <td class="remove-border-left">
                {{ order.timestamp | date: 'HH:mm' }}
            </td>
            <td class="remove-border-left">
                {{
                    (order.price / 100).toLocaleString('de-DE', {
                        style: 'currency',
                        currency: 'EUR',
                    })
                }}
            </td>
            <td class="remove-border-left">
                <a [routerLink]="['/order', order.id]">
                    <i class="pi pi-chevron-right grey-icon"> </i>
                </a>
            </td>
        </tr>
    </ng-template>
</p-table>
