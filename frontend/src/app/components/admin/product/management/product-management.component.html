<p-table
    class="table"
    [value]="items"
    [lazy]="true"
    (onLazyLoad)="loadProducts($event)"
    [paginator]="true"
    [rows]="page?.size ?? DEFAULT_ITEMS_PER_PAGE"
    [totalRecords]="page?.total_elements ?? 0"
    [rowsPerPageOptions]="[2, 25, 50]"
    [loading]="loading"
    size="large"
>
    <ng-template #caption>
        <div class="caption">
            <h1>Produkte</h1>
            <a routerLink="add">
                <i class="pi pi-plus"></i>
                Produkt hinzufügen
            </a>
        </div>
    </ng-template>

    <ng-template #header >
        <tr>
            <th>Produkt</th>
            <th>Kategorie</th>
            <th>Preis</th>
            <th>Aktionen</th>
        </tr>
    </ng-template>

    <ng-template #body let-product>
        <tr>
            <td>
                <a class="product-preview" [routerLink]="['/product', product.id]">
                    <app-product-image [width]="100" [height]="100" [productImage]="product.image"/>
                    {{ product.name }}
                </a>
            </td>
            <td class="product-category">
                {{ categoryToLabel(product.category) }}
            </td>
            <td>{{ product.price }}</td>
            <td>
                <a>
                    <i class="pi pi-eye"></i>
                </a>
                <a>
                    <i class="pi pi-pencil"></i>
                </a>
                <a>
                    <i class="pi pi-trash"></i>
                </a>
            </td>
        </tr>
    </ng-template>
</p-table>
