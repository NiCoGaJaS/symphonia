<div class="general">
    <div class="top product-name">
        {{ product().name }}
    </div>

    {{ product().summary }}

    <p-divider />

    <div class="product-order-information">
        <div>
            <i class="pi pi-check" style="color: var(--primary-blue)"></i>
            <p>Kostenloser Versand</p>
        </div>
        <div>
            <i class="pi pi-check color-blue"></i>
            <p>1-3 Tage Lieferzeit</p>
        </div>
        <div>
            <i class="pi pi-check color-blue"></i>
            <p>Hochwertige Verarbeitung</p>
        </div>
    </div>

    <p-divider />

    <div class="product-price-wrapper">
        <div class="product-price">
            {{ product().price | number: '1.2-2' }}€
        </div>
        <div class="product-price-add">inkl. MwSt.</div>
    </div>

    <div class="product-order-status">
        <i class="pi pi-check-circle"></i>
        <p class="">Sofort lieferbar</p>
    </div>

    <div class="product-order-group">
        <p-inputnumber
            [(ngModel)]="amount"
            [min]="1"
            [max]="5"
            [showButtons]="true"
            buttonLayout="horizontal"
            inputId="horizontal"
            spinnerMode="horizontal"
            [step]="1"
            [inputStyle]="{ width: '3.25rem', textAlign: 'center' }"
        >
            <ng-template #incrementbuttonicon>
                <span class="pi pi-plus"></span>
            </ng-template>
            <ng-template #decrementbuttonicon>
                <span class="pi pi-minus"></span>
            </ng-template>
        </p-inputnumber>

        <button
            class="product-order button-blue"
            type="button"
            (click)="addToCart()"
        >
            In den Warenkorb
        </button>
    </div>
</div>
