<div
    class="wrapper"
    [style.inline-size]="'min(100%, ' + width() + 'px)'"
    [style.block-size]="'min(100%, ' + height() + 'px)'"
>
    <img
        class="product-image"
        [ngSrc]="productImage().url"
        [alt]="productImage().alternative_text"
        [height]="height()"
        [width]="width()"
    />
</div>
